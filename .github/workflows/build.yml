name: 小米6 sagit 内核自动构建

on:
  workflow_dispatch:

jobs:
  build:
    name: Build sagit (ReSukiSU + SUSFS)
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id

    steps:

    - name: 拉取构建脚本仓库
      uses: actions/checkout@v4

    - name: 读取编译配置
      run: |
        grep -E '^(KERNEL_SOURCE|KERNEL_SOURCE_BRANCH|KERNEL_DEFCONFIG|KERNEL_FRAGMENT|KERNEL_ZIP_NAME|ENABLE_KERNELSU|ENABLE_SUSFS|SUSFS_BRANCH|SUSFS_|EXTRA_CONFIG|ENABLE_CUSTOM_PATCHES)=' config.env >> $GITHUB_ENV || true

    - name: 安装编译依赖
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends \
          git make bc bison flex libelf-dev ccache \
          libssl-dev zip cpio curl wget \
          device-tree-compiler ca-certificates \
          python3 python-is-python3 \
          binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
        sudo ln -sf /usr/bin/python3 /usr/bin/python || true
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: 下载 clang 12.0.5
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone -q --depth=1 --single-branch \
          https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
          -b android12-release clang-aosp
        ls clang-aosp/clang-r416183b/bin/clang

    - name: 下载内核源码
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone ${{ env.KERNEL_SOURCE }} \
          -b ${{ env.KERNEL_SOURCE_BRANCH }} \
          android-kernel --depth=1

    - name: 集成 ReSukiSU
      if: env.ENABLE_KERNELSU == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        rm -rf KernelSU drivers/kernelsu
        git checkout -- . 2>/dev/null || true
        curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
        echo "--- KSU 目录 ---"
        if [ -d KernelSU ]; then ls KernelSU; else ls drivers/kernelsu; fi

    - name: 注入 ReSukiSU manual hook
      if: env.ENABLE_KERNELSU == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        python3 ${{ github.workspace }}/scripts/inject_ksu_hooks.py .

    - name: 下载 SUSFS（多源回退）
      if: env.ENABLE_SUSFS == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        export GIT_TERMINAL_PROMPT=0
        BR="${{ env.SUSFS_BRANCH }}"
        OK=0
        for URL in \
          "https://github.com/ShirkNeko/susfs4ksu" \
          "https://github.com/yougotme101/susfs4ksu" \
          "https://gitlab.com/simonpunk/susfs4ksu" \
          "https://github.com/Castorice4/susfs4ksu" ; do
          rm -rf susfs
          echo "==> 尝试 $URL (分支 $BR)"
          if git clone -q --depth=1 -b "$BR" "$URL" susfs 2>/dev/null \
             && [ -d susfs/kernel_patches ]; then
            echo "✅ SUSFS 拉取成功: $URL"
            OK=1
            break
          fi
        done
        if [ "$OK" != "1" ]; then
          rm -rf susfs
          echo "⚠ 所有 SUSFS 源均失败，降级为仅 ReSukiSU"
          echo "ENABLE_SUSFS=false" >> $GITHUB_ENV
        else
          echo "--- kernel_patches 列表 ---"
          ls susfs/kernel_patches/ || true
        fi

    - name: 注入 SUSFS 文件
      if: env.ENABLE_SUSFS == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        K=android-kernel
        SRC=""; HDR=""
        for D in susfs/kernel_patches/fs susfs/fs; do
          if [ -f "$D/susfs.c" ]; then SRC="$D"; break; fi
        done
        for H in susfs/kernel_patches/include/linux susfs/include/linux; do
          if [ -f "$H/susfs.h" ]; then HDR="$H"; break; fi
        done
        if [ -z "$SRC" ] || [ -z "$HDR" ]; then
          echo "⚠ susfs 源文件缺失，降级为仅 ReSukiSU"
          echo "ENABLE_SUSFS=false" >> $GITHUB_ENV
          exit 0
        fi
        cp "$SRC/susfs.c"            $K/fs/susfs.c
        cp "$HDR/susfs.h"            $K/include/linux/susfs.h
        if [ -f "$HDR/susfs_def.h" ]; then cp "$HDR/susfs_def.h" $K/include/linux/susfs_def.h; fi
        grep -q "susfs.o" $K/fs/Makefile || echo "obj-y += susfs.o" >> $K/fs/Makefile
        echo "✅ SUSFS 文件已注入"

    # 跳过 kernel/sys.c（本机该文件被魔改，uname 补丁必冲突）
    - name: 应用 SUSFS 内核补丁
      if: env.ENABLE_SUSFS == 'true'
      run: |
        set +e
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        P=""
        for f in \
          ../susfs/kernel_patches/50_add_susfs_in_kernel-4.9*.patch \
          ../susfs/kernel_patches/50_add_susfs_in_kernel-4.4*.patch \
          ../susfs/kernel_patches/50_add_susfs_in_kernel*.patch \
          ../susfs/kernel_patches/*add_susfs*.patch ; do
          if [ -f "$f" ]; then P="$f"; break; fi
        done
        if [ -z "$P" ]; then
          echo "⚠ 未找到 SUSFS 内核补丁，降级为仅 ReSukiSU"
          echo "ENABLE_SUSFS=false" >> $GITHUB_ENV
          exit 0
        fi
        echo "==> 使用补丁: $P"
        patch -p1 --fuzz=5 --no-backup-if-mismatch \
          --exclude=kernel/sys.c \
          < "$P" || echo "⚠ 补丁部分冲突"

        REJ=$(find . -name "*.rej" 2>/dev/null || true)
        if [ -n "$REJ" ]; then
          echo "===== 冲突残留 .rej 内容 ====="
          for r in $REJ; do
            echo "----------- $r -----------"
            cat "$r" || true
          done
          if echo "$REJ" | grep -qi "kallsyms"; then
            echo "⚠ kallsyms.c 冲突（关键文件），降级为仅 ReSukiSU"
            echo "ENABLE_SUSFS=false" >> $GITHUB_ENV
          else
            echo "⚠ 仅非关键文件冲突，继续编译"
          fi
          find . -name "*.rej" -delete 2>/dev/null || true
          find . -name "*.orig" -delete 2>/dev/null || true
        else
          echo "✅ 内核补丁无冲突"
        fi
        exit 0

    # ★ 修复点：ls 在 set -e 下失败会直接终止 job → 全部加 || true
    - name: 应用 SUSFS 的 KSU 补丁
      if: env.ENABLE_SUSFS == 'true'
      run: |
        set +e
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        if [ -d KernelSU ]; then KSU_DIR=KernelSU; else KSU_DIR=drivers/kernelsu; fi
        if [ ! -d "$KSU_DIR" ]; then
          echo "⚠ 未找到 $KSU_DIR，降级为仅 ReSukiSU"
          echo "ENABLE_SUSFS=false" >> $GITHUB_ENV
          exit 0
        fi
        cd "$KSU_DIR" || exit 0
        # 两次 ls 都加 || true，避免 glob 无匹配时返回 2 触发 set -e
        PATCHES=$(ls ../../susfs/kernel_patches/KernelSU/*.patch ../../susfs/kernel_patches/KSU/*.patch 2>/dev/null || true)
        if [ -z "$PATCHES" ]; then
          PATCHES=$(ls ../../susfs/kernel_patches/10_enable_susfs_for_ksu.patch 2>/dev/null || true)
        fi
        if [ -z "$PATCHES" ]; then
          echo "⚠ 无 KSU 侧补丁（susfs 仓库未带 KSU 目录），继续编译"
          exit 0
        fi
        for p in $PATCHES; do
          if [ ! -f "$p" ]; then continue; fi
          echo "==> 打补丁 $p"
          patch -p1 --fuzz=5 < "$p" || echo "⚠ 冲突: $p"
        done
        exit 0

    - name: 探测 SUSFS 补丁覆盖范围
      if: env.ENABLE_SUSFS == 'true'
      run: |
        set +e
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        echo "===== 各文件 susfs 补丁命中情况 ====="
        for f in kernel/sys.c kernel/kallsyms.c fs/stat.c fs/open.c fs/read_write.c fs/namei.c fs/exec.c; do
          if [ -f "$f" ] && grep -qi "susfs" "$f"; then
            echo "  [命中] $f"
          else
            echo "  [未中] $f"
          fi
        done
        exit 0

    - name: 应用自定义补丁
      if: env.ENABLE_CUSTOM_PATCHES == 'true'
      run: |
        set +e
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        for p in ${{ github.workspace }}/patches/*.patch; do
          if [ ! -f "$p" ]; then continue; fi
          echo "==> $p"
          git apply --3way "$p" || patch -p1 --fuzz=3 < "$p" || echo "⚠ 失败: $p"
        done
        exit 0

    - name: 设置 ccache
      uses: hendrikmuhs/ccache-action@v1.2.11
      with:
        key: build-kernel-sagit-44-resukisu-susfs
        max-size: 2G

    - name: 编译内核
      id: build
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/clang-r416183b/bin:$PATH
        # 提前创建，保证失败时也能上传
        touch build.log

        echo "===== (1) 生成 defconfig ====="
        make O=out ARCH=arm64 ${{ env.KERNEL_DEFCONFIG }} 2>&1 | tail -20

        echo "===== (2) 叠加 sagit 片段 ====="
        cat ${{ env.KERNEL_FRAGMENT }} >> out/.config

        cat >> out/.config <<'EOF'
        CONFIG_LOCALVERSION="-ReSukiSU"
        # CONFIG_CC_WERROR is not set
        CONFIG_KALLSYMS=y
        CONFIG_KALLSYMS_ALL=y
        CONFIG_KPROBES=y
        CONFIG_KPROBE_EVENTS=y
        EOF

        if [ "${{ env.ENABLE_KERNELSU }}" = "true" ]; then
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> out/.config
        fi

        # ── SUSFS 全功能开启（带安全探测）──
        if [ "${{ env.ENABLE_SUSFS }}" = "true" ]; then
          echo "CONFIG_KSU_SUSFS=y" >> out/.config

          # 不依赖补丁的核心功能：直接开
          if [ "${{ env.SUSFS_SUS_PATH }}" = "true" ]; then
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> out/.config; fi
          if [ "${{ env.SUSFS_SUS_MOUNT }}" = "true" ]; then
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> out/.config; fi
          if [ "${{ env.SUSFS_SUS_KSTAT }}" = "true" ]; then
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> out/.config; fi
          if [ "${{ env.SUSFS_TRY_UMOUNT }}" = "true" ]; then
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> out/.config; fi
          if [ "${{ env.SUSFS_OPEN_REDIRECT }}" = "true" ]; then
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> out/.config; fi
          if [ "${{ env.SUSFS_SUS_SU }}" = "true" ]; then
            echo "CONFIG_KSU_SUSFS_SUS_SU=y" >> out/.config; fi
          if [ "${{ env.SUSFS_SUS_OVERLAYFS }}" = "true" ]; then
            echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y" >> out/.config; fi
          if [ "${{ env.SUSFS_SPOOF_CMDLINE }}" = "true" ]; then
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> out/.config; fi
          if [ "${{ env.SUSFS_AUTO_ADD_BIND_MOUNT }}" = "true" ]; then
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> out/.config; fi
          if [ "${{ env.SUSFS_AUTO_ADD_KSTAT }}" = "true" ]; then
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSTAT=y" >> out/.config; fi
          if [ "${{ env.SUSFS_ENABLE_LOG }}" = "true" ]; then
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> out/.config; fi

          # 依赖补丁的功能：探测命中才开
          if [ "${{ env.SUSFS_SPOOF_STAT }}" = "true" ] && grep -qi "susfs" fs/stat.c; then
            echo "CONFIG_KSU_SUSFS_SPOOF_STAT=y" >> out/.config
            echo "  ✓ SPOOF_STAT 已开启"; else echo "  · SPOOF_STAT 跳过"; fi

          if [ "${{ env.SUSFS_SPOOF_UNAME }}" = "true" ] && grep -qi "susfs" kernel/sys.c; then
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> out/.config
            echo "  ✓ SPOOF_UNAME 已开启"; else echo "  · SPOOF_UNAME 跳过"; fi

          if [ "${{ env.SUSFS_HIDE_SYMBOLS }}" = "true" ] && grep -qi "susfs" kernel/kallsyms.c; then
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> out/.config
            echo "  ✓ HIDE_SYMBOLS 已开启"; else echo "  · HIDE_SYMBOLS 跳过"; fi
        fi

        if [ -n "${{ env.EXTRA_CONFIG }}" ]; then
          echo "${{ env.EXTRA_CONFIG }}" >> out/.config
        fi

        echo "===== (3) olddefconfig ====="
        make O=out ARCH=arm64 olddefconfig 2>&1 | tail -20

        echo "===== (4) 确认生效的配置 ====="
        grep -E "CONFIG_KSU" out/.config || echo "(无)"

        echo "===== (5) 正式编译 ====="
        make -j$(nproc --all) \
          CC="ccache clang" \
          O=out \
          ARCH=arm64 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          > build.log 2>&1
        echo "make 退出码: $?"

        echo "===== ReSukiSU hook 检查结果 ====="
        grep -E "ReSukiSU/manual_hook|You lost|manual_hook_check" build.log | head -20 || true

        if [ ! -f out/arch/arm64/boot/Image.gz-dtb ]; then
          echo "########## 全部 error 行 ##########"
          grep -nE "error:|Error [0-9]+|fatal error|undefined reference|No such file" build.log | head -40 || true
          echo "########## 第一个 error 上下文 ##########"
          FIRST=$(grep -n "error:" build.log | head -1 | cut -d: -f1 || true)
          if [ -n "$FIRST" ]; then
            S=$((FIRST>20 ? FIRST-20 : 1))
            sed -n "${S},$((FIRST+20))p" build.log
          fi
          echo "########## 日志末尾 60 行 ##########"
          tail -60 build.log
          echo "::error::编译失败，完整日志见 artifact build-log"
          exit 1
        fi
        ls -lh out/arch/arm64/boot/Image.gz-dtb

    - name: 上传编译日志（失败时）
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: kernel_workspace/android-kernel/build.log
        if-no-files-found: ignore

    - name: 打包 AnyKernel3
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone -q --depth=1 https://github.com/osm0sis/AnyKernel3

        # ★ AnyKernel3 变量名是大写，大小写都替换
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
        sed -i 's/DO.DEVICECHECK=1/DO.DEVICECHECK=0/g' AnyKernel3/anykernel.sh
        sed -i 's!^IS_SLOT_DEVICE=.*!IS_SLOT_DEVICE=0;!g' AnyKernel3/anykernel.sh
        sed -i 's!^is_slot_device=.*!is_slot_device=0;!g' AnyKernel3/anykernel.sh
        sed -i 's!^BLOCK=.*!BLOCK=auto;!g' AnyKernel3/anykernel.sh
        sed -i 's!^block=.*!block=auto;!g' AnyKernel3/anykernel.sh

        echo "===== 打包前确认关键行 ====="
        grep -nE "^(BLOCK|block|IS_SLOT_DEVICE|is_slot_device|do.devicecheck|DO.DEVICECHECK)" AnyKernel3/anykernel.sh || true

        cp android-kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        rm -rf AnyKernel3/.git* AnyKernel3/README.md \
               AnyKernel3/ramdisk AnyKernel3/modules AnyKernel3/patch

    - name: 上传产物
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.KERNEL_ZIP_NAME }}
        path: kernel_workspace/AnyKernel3/*
